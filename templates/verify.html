<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claudia — verify</title>
  <link rel="stylesheet" href="{{ base_path }}/static/css/auth.css" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('claudia_theme') || 'dark');</script>
</head>
<body>
  <div class="card">
    <h1>check your email</h1>
    <p class="hint">A 6-digit verification code was sent to your email address. It expires in&nbsp;5&nbsp;minutes.</p>

    {% if !error.is_empty() %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ base_path }}/verify">
      <label for="otp">verification code</label>
      <input
        type="text"
        id="otp"
        name="otp"
        class="otp-input"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="000000"
        autofocus
        autocomplete="one-time-code"
        required
      />
      <br style="margin:.75rem 0;display:block" />
      <button type="submit">verify →</button>
    </form>

    <p class="back"><a href="{{ base_path }}/login">← back to sign in</a></p>
  </div>
</body>
</html>
