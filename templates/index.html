<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <link id="hljs-theme-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link id="hljs-theme-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" disabled />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── theme tokens ───────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:           #212121;
      --bg2:          #181818;
      --surface:      #2f2f2f;
      --surface2:     #3a3a3a;
      --border:       #3d3d3d;
      --user-bg:      #303030;
      --text:         #ececec;
      --text-muted:   #8e8ea0;
      --text-faint:   #555;
      --accent:       #a78bfa;
      --accent-hover: #c4b5fd;
      --send-bg:      #a78bfa;
      --danger:       #f87171;
      --code-bg:      #161616;
    }
    :root[data-theme="light"] {
      --bg:           #f9f9f9;
      --bg2:          #f0f0f0;
      --surface:      #ffffff;
      --surface2:     #ebebeb;
      --border:       #d4d4d4;
      --user-bg:      #f0f0f0;
      --text:         #1a1a1a;
      --text-muted:   #666;
      --text-faint:   #aaa;
      --accent:       #7c3aed;
      --accent-hover: #6d28d9;
      --send-bg:      #7c3aed;
      --danger:       #dc2626;
      --code-bg:      #f6f8fa;
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      display: flex;
      flex-direction: row;
    }

    /* ── sidebar ────────────────────────────────────── */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      transition: width .2s;
    }
    #sidebar.collapsed { width: 0; border-right: none; }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header span {
      font-size: .8rem; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: .06em; white-space: nowrap;
    }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
    }
    #session-list::-webkit-scrollbar { width: 4px; }
    #session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .session-item {
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s;
      margin-bottom: 2px;
      overflow: hidden;
    }
    .session-item:hover  { background: var(--surface2); }
    .session-item.active { background: var(--surface); }
    .session-item .s-title {
      font-size: .85rem; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .session-item .s-meta { font-size: .72rem; color: var(--text-muted); margin-top: 2px; }

    .sidebar-empty {
      text-align: center; color: var(--text-faint);
      font-size: .8rem; padding: 24px 12px;
    }

    /* ── main column ────────────────────────────────── */
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -.3px; }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: color .12s, border-color .12s, background .12s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface2); }
    .icon-btn svg { width: 16px; height: 16px; }

    .new-chat-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 14px; border-radius: 20px;
      font-size: .8rem; cursor: pointer;
      transition: color .12s, border-color .12s; white-space: nowrap;
    }
    .new-chat-btn:hover { color: var(--text); border-color: var(--accent); }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px; border-radius: 20px;
      font-size: .8rem; cursor: pointer;
      transition: color .12s, border-color .12s; white-space: nowrap;
    }
    .logout-btn:hover { color: #e57373; border-color: #e57373; }

    /* ── scrollable content area ────────────────────── */
    /* Both #messages and #history-panel live here and swap visibility */
    #scroll-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #scroll-area::-webkit-scrollbar { width: 5px; }
    #scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    #messages, #history-panel {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px;
      flex-direction: column;
      flex: 1;
    }
    #messages      { display: flex; }
    #history-panel { display: none; }
    #history-panel.visible { display: flex; }

    /* ── messages ───────────────────────────────────── */
    .message {
      display: flex; gap: 12px;
      padding: 16px 18px; border-radius: 12px;
      animation: fadeSlide .16s ease both; margin-bottom: 4px;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user      { background: var(--user-bg); }
    .message.assistant { background: transparent; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 700;
    }
    .avatar.user      { background: #6366f1; color: #fff; }
    .avatar.assistant { background: #cc785c; color: #fff; }

    .content { flex: 1; min-width: 0; line-height: 1.65; }
    .content p            { margin-bottom: .7em; }
    .content p:last-child { margin-bottom: 0; }
    .content h1,.content h2,.content h3 { margin: 1em 0 .35em; font-weight: 600; }
    .content ul,.content ol { padding-left: 1.4em; margin-bottom: .7em; }
    .content li { margin-bottom: .15em; }
    .content code:not(pre code) {
      background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: .87em;
    }
    .content pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: .7em 0; font-size: .84em;
    }
    .content blockquote {
      border-left: 3px solid var(--accent); padding-left: 1em; color: var(--text-muted); margin: .7em 0;
    }
    .content table { border-collapse: collapse; margin: .7em 0; width: 100%; }
    .content th,.content td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .content th { background: var(--surface); }
    .content a { color: var(--accent); }

    /* thinking */
    .thinking {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-muted); font-size: .9rem; padding: 16px 18px;
    }
    .dot-pulse { display: flex; gap: 4px; }
    .dot-pulse span {
      width: 6px; height: 6px; background: var(--text-muted);
      border-radius: 50%; animation: pulse 1.2s infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: .2s; }
    .dot-pulse span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,80%,100% { opacity:.25; transform:scale(.8); }
      40%         { opacity:1;   transform:scale(1); }
    }

    .error-msg {
      background: #3b1a1a; border: 1px solid #7f1d1d; color: var(--danger);
      border-radius: 10px; padding: 10px 14px; margin: 4px 0; font-size: .88rem;
    }
    :root[data-theme="light"] .error-msg { background: #fef2f2; border-color: #fca5a5; }

    /* history detail panel */
    #history-panel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--text-muted); }
    .h-turn { margin-bottom: 20px; border-left: 3px solid var(--border); padding-left: 14px; }
    .h-turn .h-meta  { font-size: .72rem; color: var(--text-faint); margin-bottom: 6px; }
    .h-turn .h-user  { font-weight: 500; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
    .h-turn .h-assistant { color: var(--text-muted); font-size: .92rem; }
    .h-back-btn {
      align-self: flex-start; margin-bottom: 18px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); padding: 5px 14px; border-radius: 20px;
      font-size: .8rem; cursor: pointer; transition: color .12s, border-color .12s;
    }
    .h-back-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── input area ─────────────────────────────────── */
    .input-wrap {
      padding: 12px 20px 18px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .input-inner {
      max-width: 860px;
      margin: 0 auto;
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 10px; transition: border-color .12s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    #message {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 15px;
      line-height: 1.5; resize: none; max-height: 200px; overflow-y: auto;
    }
    #message::placeholder { color: var(--text-muted); }
    #send-btn {
      background: var(--send-bg); border: none; border-radius: 8px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: background .12s, opacity .12s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { opacity: .4; cursor: default; }
    #send-btn svg { width: 15px; height: 15px; color: #fff; }
    .hint { text-align: center; color: var(--text-faint); font-size: .72rem; margin-top: 6px; }

    /* ── empty state ────────────────────────────────── */
    #empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; gap: 10px;
      color: var(--text-muted); pointer-events: none; user-select: none;
    }
    #empty-state svg { width: 44px; height: 44px; opacity: .3; }
    #empty-state p   { font-size: 1.05rem; }
  </style>
</head>
<body>

  <!-- ── sidebar ──────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span>History</span>
      <button class="icon-btn" onclick="toggleSidebar()" title="Close sidebar" style="width:24px;height:24px;border:none;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
    </div>
    <div id="session-list">
      <div class="sidebar-empty">Loading…</div>
    </div>
  </aside>

  <!-- ── main ─────────────────────────────────────────────── -->
  <div id="main">
    <header>
      <button class="icon-btn" onclick="toggleSidebar()" title="Toggle history" id="sidebar-toggle-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="#cc785c"/>
      </svg>
      <h1>Claude</h1>

      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" style="margin-left:auto;">
        <!-- sun icon (shown in dark mode) -->
        <svg id="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0-5a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0v-1a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l.7.7a1 1 0 0 1-1.41 1.42l-.71-.71a1 1 0 0 1 0-1.41zm13.02 13.02a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1-1.41 1.41l-.71-.71a1 1 0 0 1 0-1.41zM3 11h1a1 1 0 0 1 0 2H3a1 1 0 0 1 0-2zm17 0h1a1 1 0 0 1 0 2h-1a1 1 0 0 1 0-2zM5.64 17.66l-.71.71a1 1 0 1 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 1.41zm12.02-12.02l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1-1.41-1.41z"/></svg>
        <!-- moon icon (shown in light mode) -->
        <svg id="icon-moon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>

      <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
      <form method="post" action="/logout" style="margin:0">
        <button type="submit" class="logout-btn" title="Sign out">sign out</button>
      </form>
    </header>

    <!-- scrollable area: chat messages OR history detail (swapped by JS) -->
    <div id="scroll-area">
      <div id="messages">
        <div id="empty-state">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          <p>How can I help you today?</p>
        </div>
      </div>
      <div id="history-panel"></div>
    </div>

    <input type="hidden" id="cl-history" value="[]" />

    <div class="input-wrap">
      <div class="input-inner">
        <form id="chat-form" onsubmit="sendChat(event)">
          <div class="input-row">
            <textarea id="message" placeholder="Message Claude…" rows="1"
              onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button type="submit" id="send-btn" title="Send">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </form>
        <p class="hint">Claude can make mistakes. Verify important information.</p>
      </div>
    </div>
  </div><!-- /#main -->

  <script>
  // ── theme ─────────────────────────────────────────────────────────────
  (function () {
    const saved = localStorage.getItem('claudai_theme') || 'dark';
    applyTheme(saved);
  })();

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('hljs-theme-dark').disabled  = (t === 'light');
    document.getElementById('hljs-theme-light').disabled = (t === 'dark');
    const sun  = document.getElementById('icon-sun');
    const moon = document.getElementById('icon-moon');
    if (sun && moon) {
      sun.style.display  = t === 'dark'  ? '' : 'none';
      moon.style.display = t === 'light' ? '' : 'none';
    }
    localStorage.setItem('claudai_theme', t);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  // ── session ID ────────────────────────────────────────────────────────
  function getSessionId() {
    let sid = sessionStorage.getItem('claudai_session');
    if (!sid) { sid = crypto.randomUUID(); sessionStorage.setItem('claudai_session', sid); }
    return sid;
  }

  // ── sidebar ───────────────────────────────────────────────────────────
  let sidebarOpen = true;

  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
    if (sidebarOpen) loadSessions();
  }

  async function loadSessions() {
    const list = document.getElementById('session-list');
    try {
      const r = await fetch('/api/sessions');
      const sessions = await r.json();
      if (!sessions.length) {
        list.innerHTML = '<div class="sidebar-empty">No history yet</div>';
        return;
      }
      list.innerHTML = sessions.map(s => `
        <div class="session-item" onclick="openSession('${s.session_id}')" data-sid="${s.session_id}">
          <div class="s-title">${escHtml(truncate(s.first_message, 38))}</div>
          <div class="s-meta">${s.turn_count} turn${s.turn_count !== 1 ? 's' : ''} · ${fmtDate(s.started_at)}</div>
        </div>`).join('');
    } catch(e) {
      list.innerHTML = '<div class="sidebar-empty">Failed to load</div>';
    }
  }

  async function openSession(sid) {
    // highlight active
    document.querySelectorAll('.session-item').forEach(el =>
      el.classList.toggle('active', el.dataset.sid === sid));

    const panel = document.getElementById('history-panel');
    const msgs  = document.getElementById('messages');
    panel.innerHTML = '';
    panel.classList.remove('visible');

    try {
      const r    = await fetch(`/api/sessions/${sid}`);
      const turns = await r.json();

      const back = document.createElement('button');
      back.className = 'h-back-btn';
      back.textContent = '← Back to chat';
      back.onclick = closeHistoryPanel;
      panel.appendChild(back);

      const title = document.createElement('h2');
      title.textContent = `Session — ${turns.length} turn${turns.length !== 1 ? 's' : ''}`;
      panel.appendChild(title);

      turns.forEach(t => {
        const div = document.createElement('div');
        div.className = 'h-turn';
        div.innerHTML = `
          <div class="h-meta">${fmtDate(t.created_at)}</div>
          <div class="h-user">${escHtml(t.user_message)}</div>
          <div class="h-assistant content">${renderMarkdown(t.assistant_response)}</div>`;
        panel.appendChild(div);
        if (window.hljs) div.querySelectorAll('pre code').forEach(hljs.highlightElement);
      });

      msgs.style.display     = 'none';
      panel.classList.add('visible');
    } catch(e) {
      panel.innerHTML = `<p style="color:var(--danger)">Failed to load session: ${e.message}</p>`;
      panel.classList.add('visible');
    }
  }

  function closeHistoryPanel() {
    const panel = document.getElementById('history-panel');
    panel.classList.remove('visible');
    panel.innerHTML = '';
    document.getElementById('messages').style.display = '';
    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  }

  // ── helpers ───────────────────────────────────────────────────────────
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch { return iso; }
  }
  function renderMarkdown(text) {
    if (window.marked) return marked.parse(text);
    return '<p>' + escHtml(text).replace(/\n/g,'<br>') + '</p>';
  }
  function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  function scrollToBottom() {
    const sa = document.getElementById('scroll-area');
    sa.scrollTop = sa.scrollHeight;
  }
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-form').requestSubmit(); }
  }

  function newChat() {
    sessionStorage.removeItem('claudai_session');
    document.getElementById('cl-history').value = '[]';
    closeHistoryPanel();
    document.getElementById('messages').innerHTML = `
      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:44px;height:44px;opacity:.3">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
        <p>How can I help you today?</p>
      </div>`;
    if (sidebarOpen) loadSessions();
  }

  // ── chat ──────────────────────────────────────────────────────────────
  async function sendChat(e) {
    e.preventDefault();

    // if history panel is showing, go back to chat first
    closeHistoryPanel();

    const textarea = document.getElementById('message');
    const msg = textarea.value.trim();
    if (!msg) return;

    const history = JSON.parse(document.getElementById('cl-history').value || '[]');
    const msgs    = document.getElementById('messages');

    // remove empty state
    document.getElementById('empty-state')?.remove();

    // user bubble
    const userBubble = document.createElement('div');
    userBubble.className = 'message user';
    userBubble.innerHTML = `
      <div class="avatar user">You</div>
      <div class="content"><p>${escHtml(msg).replace(/\n/g,'<br>')}</p></div>`;
    msgs.appendChild(userBubble);

    // thinking indicator
    const thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.id = 'thinking-indicator';
    thinking.innerHTML = `
      <div class="avatar assistant">AI</div>
      <div class="dot-pulse"><span></span><span></span><span></span></div>`;
    msgs.appendChild(thinking);
    scrollToBottom();

    textarea.value = '';
    textarea.style.height = 'auto';
    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-HTTP-Method-Override': 'GET',
        },
        body: JSON.stringify({ message: msg, history, session_id: getSessionId() }),
      });

      document.getElementById('thinking-indicator')?.remove();

      if (!resp.ok) {
        const errText = await resp.text();
        const errEl = document.createElement('div');
        errEl.className = 'error-msg';
        errEl.textContent = `Error: ${errText}`;
        msgs.appendChild(errEl);
        scrollToBottom();
        return;
      }

      const html = await resp.text();
      const tmp  = document.createElement('div');
      tmp.innerHTML = html;

      // extract updated history
      const historyEl = tmp.querySelector('[data-history-update]');
      if (historyEl) {
        document.getElementById('cl-history').value = historyEl.getAttribute('data-history-update');
        historyEl.remove();
      }

      // render markdown in assistant content
      tmp.querySelectorAll('.assistant-raw-content').forEach(el => {
        el.innerHTML = renderMarkdown(el.textContent);
        el.classList.remove('assistant-raw-content');
        if (window.hljs) el.querySelectorAll('pre code').forEach(hljs.highlightElement);
      });

      msgs.appendChild(tmp);
      scrollToBottom();

      // refresh sidebar if open
      if (sidebarOpen) loadSessions();

    } catch(err) {
      document.getElementById('thinking-indicator')?.remove();
      const errEl = document.createElement('div');
      errEl.className = 'error-msg';
      errEl.textContent = `Network error: ${err.message}`;
      msgs.appendChild(errEl);
      scrollToBottom();
    } finally {
      sendBtn.disabled = false;
      textarea.focus();
    }
  }

  // init: load sessions on page load
  loadSessions();
  </script>
</body>
</html>
