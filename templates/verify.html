<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claudia — verify</title>
  <style>
    :root[data-theme="dark"] {
      --bg:       #1a1a1b;
      --surface:  #242526;
      --border:   #393939;
      --text:     #d0d2d5;
      --muted:    #7a7d82;
      --accent:   #e8a045;
      --err:      #d95b5b;
    }
    :root[data-theme="light"] {
      --bg:       #f6f6f6;
      --surface:  #ffffff;
      --border:   #d0d0d0;
      --text:     #242526;
      --muted:    #6a6e77;
      --accent:   #c96a10;
      --err:      #c0392b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: min(380px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
    .hint { font-size: .9rem; color: var(--muted); line-height: 1.5; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: .35rem; }
    input[type="text"] {
      width: 100%;
      padding: .6rem .9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.6rem;
      letter-spacing: .4em;
      text-align: center;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      width: 100%;
      padding: .65rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .88; }
    .error {
      color: var(--err);
      font-size: .875rem;
      padding: .5rem .75rem;
      background: color-mix(in srgb, var(--err) 12%, transparent);
      border-radius: 6px;
    }
    .back { font-size: .85rem; color: var(--muted); text-align: center; }
    .back a { color: var(--accent); text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
  <script>
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  </script>
</head>
<body>
  <div class="card">
    <h1>check your email</h1>
    <p class="hint">A 6-digit verification code was sent to your email address. It expires in&nbsp;5&nbsp;minutes.</p>

    {% if !error.is_empty() %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ base_path }}/verify">
      <label for="otp">verification code</label>
      <input
        type="text"
        id="otp"
        name="otp"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="000000"
        autofocus
        autocomplete="one-time-code"
        required
      />
      <br style="margin:.75rem 0;display:block" />
      <button type="submit">verify →</button>
    </form>

    <p class="back"><a href="{{ base_path }}/login">← back to sign in</a></p>
  </div>
</body>
</html>
