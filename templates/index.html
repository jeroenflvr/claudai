<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude AI</title>
  <!-- HTMX for progressive enhancement on any non-chat interactions -->
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <!-- marked.js for markdown rendering of Claude's responses -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
  <!-- highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #212121;
      --surface:     #2f2f2f;
      --border:      #3d3d3d;
      --user-bg:     #303030;
      --text:        #ececec;
      --text-muted:  #8e8ea0;
      --accent:      #a78bfa;
      --send-bg:     #a78bfa;
      --send-hover:  #c4b5fd;
      --radius:      12px;
      --font:        'Segoe UI', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── layout ─────────────────────────────────────── */
    .chat-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 780px;
      height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header svg { width: 28px; height: 28px; }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.3px; }

    .new-chat-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .new-chat-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── messages ────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message {
      display: flex;
      gap: 14px;
      padding: 18px 20px;
      border-radius: var(--radius);
      max-width: 100%;
      animation: fadeSlide .18s ease both;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user   { background: var(--user-bg); margin: 4px 0; }
    .message.assistant { margin: 4px 0; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .avatar.user      { background: #6366f1; color: #fff; }
    .avatar.assistant { background: #cc785c; color: #fff; }

    .content { flex: 1; min-width: 0; line-height: 1.65; }

    /* markdown styling inside responses */
    .content p          { margin-bottom: .75em; }
    .content p:last-child{ margin-bottom: 0; }
    .content h1,.content h2,.content h3 { margin: 1em 0 .4em; font-weight: 600; }
    .content ul,.content ol { padding-left: 1.4em; margin-bottom: .75em; }
    .content li { margin-bottom: .2em; }
    .content code:not(pre code) {
      background: #1a1a2e;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: .88em;
    }
    .content pre {
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: .75em 0;
      font-size: .85em;
    }
    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1em;
      color: var(--text-muted);
      margin: .75em 0;
    }
    .content table { border-collapse: collapse; margin: .75em 0; width: 100%; }
    .content th, .content td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .content th { background: var(--surface); }
    .content a { color: var(--accent); }

    /* thinking indicator */
    .thinking {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: .9rem;
      padding: 18px 20px;
    }
    .dot-pulse { display: flex; gap: 4px; }
    .dot-pulse span {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: .2s; }
    .dot-pulse span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,80%,100% { opacity: .25; transform: scale(.8); }
      40%         { opacity: 1;   transform: scale(1); }
    }

    /* error banner */
    .error-msg {
      background: #3b1a1a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin: 4px 0;
      font-size: .9rem;
    }

    /* ── input area ──────────────────────────────────── */
    .input-area {
      padding: 16px 16px 20px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: var(--accent); }

    #message {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 200px;
      overflow-y: auto;
    }
    #message::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--send-bg);
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, opacity .15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--send-hover); }
    #send-btn:disabled { opacity: .4; cursor: default; }
    #send-btn svg { width: 16px; height: 16px; color: #fff; }

    .hint {
      text-align: center;
      color: var(--text-muted);
      font-size: .75rem;
      margin-top: 8px;
    }

    /* ── empty state ─────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-muted);
      pointer-events: none;
      user-select: none;
    }
    #empty-state svg { width: 48px; height: 48px; opacity: .35; }
    #empty-state p   { font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>
      <!-- Claude logo mark -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"
              fill="#cc785c"/>
      </svg>
      <h1>Claude</h1>
      <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
    </header>

    <div id="messages">
      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <p>How can I help you today?</p>
      </div>
    </div>

    <!-- Hidden: client-side conversation history, sent with every request -->
    <input type="hidden" id="history" value="[]" />

    <form id="chat-form" class="input-area" onsubmit="sendChat(event)">
      <div class="input-row">
        <textarea
          id="message"
          placeholder="Message Claude…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button type="submit" id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <p class="hint">Claude can make mistakes. Verify important information.</p>
    </form>
  </div>

  <script>
    // ── session ID (stable per browser tab, regenerated on new chat) ─────
    function getSessionId() {
      let sid = sessionStorage.getItem('claudai_session');
      if (!sid) { sid = crypto.randomUUID(); sessionStorage.setItem('claudai_session', sid); }
      return sid;
    }

    // ── configure marked ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      if (window.marked) {
        marked.setOptions({ breaks: true, gfm: true });
      }
    });

    // ── helpers ──────────────────────────────────────────────────
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMarkdown(text) {
      if (window.marked) return marked.parse(text);
      return '<p>' + escapeHtml(text).replace(/\n/g,'<br>') + '</p>';
    }

    function highlightCode(el) {
      if (window.hljs) el.querySelectorAll('pre code').forEach(hljs.highlightElement);
    }

    function autoResize(ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    function scrollToBottom() {
      const msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideEmptyState() {
      const es = document.getElementById('empty-state');
      if (es) es.remove();
    }

    function handleKey(e) {
      // Enter sends; Shift+Enter is a newline
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chat-form').requestSubmit();
      }
    }

    function newChat() {
      // New session ID so this conversation is separate in the DB
      sessionStorage.removeItem('claudai_session');
      document.getElementById('history').value = '[]';
      document.getElementById('messages').innerHTML =
        `<div id="empty-state" class="..." style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--text-muted);">
          <p style="font-size:1.1rem">How can I help you today?</p>
         </div>`;
    }

    // ── core chat function ───────────────────────────────────────
    // HTMX is used for progressive enhancement; the chat itself uses
    // fetch() because HTMX's GET helper appends params to the URL
    // and does not support a request body on GET — which is intentional here.
    async function sendChat(e) {
      e.preventDefault();

      const textarea = document.getElementById('message');
      const msg = textarea.value.trim();
      if (!msg) return;

      hideEmptyState();

      const history = JSON.parse(document.getElementById('history').value || '[]');

      // --- show user bubble immediately (optimistic) ---
      const messagesEl = document.getElementById('messages');
      const userBubble = document.createElement('div');
      userBubble.className = 'message user';
      userBubble.innerHTML = `
        <div class="avatar user">You</div>
        <div class="content"><p>${escapeHtml(msg).replace(/\n/g,'<br>')}</p></div>`;
      messagesEl.appendChild(userBubble);

      // --- show thinking indicator ---
      const thinking = document.createElement('div');
      thinking.className = 'thinking';
      thinking.id = 'thinking-indicator';
      thinking.innerHTML = `
        <div class="avatar assistant" style="width:32px;height:32px;border-radius:50%;background:#cc785c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;">AI</div>
        <div class="dot-pulse"><span></span><span></span><span></span></div>`;
      messagesEl.appendChild(thinking);
      scrollToBottom();

      // --- clear and disable input ---
      textarea.value = '';
      textarea.style.height = 'auto';
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      try {
        // We use POST so the browser allows a body (Fetch spec §4.1.5 forbids
        // GET bodies, and stuffing JSON into a header caps at ~8 KB — too
        // small for long conversation history).
        // X-HTTP-Method-Override: GET declares the semantic intent: this is an
        // idempotent read operation, just transported over POST.
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-HTTP-Method-Override': 'GET',
          },
          body: JSON.stringify({ message: msg, history, session_id: getSessionId() }),
        });

        // Remove thinking indicator
        document.getElementById('thinking-indicator')?.remove();

        if (!resp.ok) {
          const errText = await resp.text();
          const errEl = document.createElement('div');
          errEl.className = 'error-msg';
          errEl.textContent = `Error: ${errText}`;
          messagesEl.appendChild(errEl);
          scrollToBottom();
          return;
        }

        // Server returns an HTML fragment (rendered by Askama)
        const html = await resp.text();
        const tmp = document.createElement('div');
        tmp.innerHTML = html;

        // Extract updated history from the hidden element the server embeds
        const historyEl = tmp.querySelector('[data-history-update]');
        if (historyEl) {
          document.getElementById('history').value = historyEl.getAttribute('data-history-update');
          historyEl.remove();
        }

        // Render markdown in the assistant content node
        tmp.querySelectorAll('.assistant-raw-content').forEach(el => {
          const raw = el.textContent;
          el.innerHTML = renderMarkdown(raw);
          el.classList.remove('assistant-raw-content');
          highlightCode(el);
        });

        messagesEl.appendChild(tmp);
        scrollToBottom();

      } catch (err) {
        document.getElementById('thinking-indicator')?.remove();
        const errEl = document.createElement('div');
        errEl.className = 'error-msg';
        errEl.textContent = `Network error: ${err.message}`;
        messagesEl.appendChild(errEl);
        scrollToBottom();
      } finally {
        sendBtn.disabled = false;
        textarea.focus();
      }
    }
  </script>
</body>
</html>
