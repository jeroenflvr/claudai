<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claudia — sign in</title>
  <link rel="icon" type="image/svg+xml" href="{{ base_path }}/static/img/icon.svg" />
  <link rel="stylesheet" href="{{ base_path }}/static/css/auth.css" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('claudia_theme') || 'dark');</script>
</head>
<body>
  <div class="card">
    <h1>sign in to <span>claudia</span></h1>

    {% if !error.is_empty() %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ base_path }}/login">
      <label for="password">password</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password" required />
      <button type="submit">continue →</button>
    </form>
    <p style="text-align:center;font-size:.72rem;color:var(--muted)">v{{ version }}</p>
  </div>
</body>
</html>
